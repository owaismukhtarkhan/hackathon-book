<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e" />
      <stop offset="100%" stop-color="#0d0630" />
    </linearGradient>
    <linearGradient id="neonGradient" id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" />
      <stop offset="100%" stop-color="#6bff49" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)" />

  <!-- Futuristic cityscape -->
  <rect x="50" y="200" width="30" height="180" fill="#8a2be2" opacity="0.7" />
  <rect x="90" y="150" width="40" height="230" fill="#6a1cb9" opacity="0.7" />
  <rect x="140" y="180" width="25" height="200" fill="#8a2be2" opacity="0.7" />
  <rect x="175" y="120" width="50" height="260" fill="#4a148c" opacity="0.7" />
  <rect x="240" y="160" width="35" height="220" fill="#6a1cb9" opacity="0.7" />
  <rect x="290" y="100" width="60" height="280" fill="#8a2be2" opacity="0.7" />
  <rect x="370" y="140" width="45" height="240" fill="#6a1cb9" opacity="0.7" />

  <!-- Humanoid robot -->
  <g transform="translate(550, 220)">
    <!-- Body -->
    <rect x="-15" y="-40" width="30" height="60" fill="none" stroke="url(#neonGradient)" stroke-width="3" />
    <!-- Head -->
    <circle cx="0" cy="-60" r="20" fill="none" stroke="url(#neonGradient)" stroke-width="3" />
    <!-- Eyes -->
    <circle cx="-7" cy="-62" r="3" fill="#39ff14" />
    <circle cx="7" cy="-62" r="3" fill="#39ff14" />
    <!-- Arms -->
    <line x1="-25" y1="-30" x2="-45" y2="-10" stroke="url(#neonGradient)" stroke-width="3" />
    <line x1="25" y1="-30" x2="45" y2="-10" stroke="url(#neonGradient)" stroke-width="3" />
    <!-- Legs -->
    <line x1="-10" y1="20" x2="-15" y2="50" stroke="url(#neonGradient)" stroke-width="3" />
    <line x1="10" y1="20" x2="15" y2="50" stroke="url(#neonGradient)" stroke-width="3" />
    <!-- Neural network pattern on body -->
    <path d="M-10,-30 L-5,-25 L0,-30 L5,-25 L10,-30" stroke="url(#neonGradient)" stroke-width="1" fill="none" />
    <path d="M-10,-20 L0,-15 L10,-20" stroke="url(#neonGradient)" stroke-width="1" fill="none" />
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="80" r="3" fill="#39ff14" opacity="0.8">
    <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="60" r="2" fill="#39ff14" opacity="0.6">
    <animate attributeName="cy" values="60;50;60" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="300" cy="90" r="2.5" fill="#39ff14" opacity="0.7">
    <animate attributeName="cy" values="90;80;90" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="70" r="3.5" fill="#39ff14" opacity="0.9">
    <animate attributeName="cy" values="70;60;70" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Data streams -->
  <path d="M600,100 Q650,80 700,100" stroke="#39ff14" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5,5">
    <animate attributeName="d" values="M600,100 Q650,80 700,100;M600,90 Q650,70 700,90;M600,100 Q650,80 700,100" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M620,150 Q670,130 720,150" stroke="#39ff14" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="4,4">
    <animate attributeName="d" values="M620,150 Q670,130 720,150;M620,140 Q670,120 720,140;M620,150 Q670,130 720,150" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Holographic effect around robot -->
  <circle cx="550" cy="180" r="80" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.3" stroke-dasharray="2,6">
    <animate attributeName="r" values="80;90;80" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>